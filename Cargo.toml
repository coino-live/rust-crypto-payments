[package]
name = "coinolive"
version = "1.0.0"
edition = "2021"
description = "Coino Live API v2 client: accept crypto payments, custody users, withdrawals and webhook verification."
license = "MIT"
repository = "https://github.com/coino-live/rust-crypto-payments"
homepage = "https://coino.live/api-guide"
documentation = "https://coino.live/api-guide"
readme = "README.md"
keywords = ["crypto", "payments", "bitcoin", "usdt", "coinolive"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
build = "build.rs"

[dependencies]
ureq = { version = "2.9", default-features = false, features = ["tls"] }
serde = "1"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
