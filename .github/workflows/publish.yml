name: Publish to crates.io

# Run by hand from the Actions tab (or on a new version tag). Needs the repository secret CARGO_REGISTRY_TOKEN:
# a crates.io API token limited to publish-new / publish-update for the crate "coinolive".
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
